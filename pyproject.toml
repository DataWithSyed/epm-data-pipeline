[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epmdata"
version = "0.1.0"
description = "European Power Market Lab – reproducible public data pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "requests>=2.31,<3",
  "openpyxl>=3.1,<4",
  "pyarrow>=14,<20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
